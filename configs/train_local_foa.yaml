data:
  train_dir: /Volumes/MyBook/hoa_out_speech_shards/train
  val_dir: /Volumes/MyBook/hoa_out_speech_shards/test
env:
  audio_loader: torchaudio  # 'torchaudio' or 'soundfile'
  use_tqdm: true  # true for tqdm, false for print
io:
  checkpoint_dir: ./checkpoints
  generator_samples_dir: ./generator_samples
  val_samples_dir: ./val_samples
  log_dir: ./logs
model:
  in_channels: 4
training:
  max_steps: 100000
  pretrain_mel_steps: 0
  train_batch_size: 4
  val_batch_size: 4
  train_num_workers: 8
  val_num_workers: 4
  pin_memory: true
  lr: 2e-4
  mel_loss_coeff: 45.0
  mrd_loss_coeff: 1.0
  bandwidth: 6.6
  spatial_loss_coeff: 0.01
  spatial_loss_every: 5
  val_every: 5000
  save_every: 5000
  sample_every: 5000
  max_checkpoints: 10
  device: cuda