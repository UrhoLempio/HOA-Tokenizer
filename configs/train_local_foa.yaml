data:
  train_dir: /Volumes/MyBook/hoa_out_speech_shards/train
  val_dir: /Volumes/MyBook/hoa_out_speech_shards/test
env:
  audio_loader: torchaudio  # 'torchaudio' or 'soundfile'
  use_tqdm: true  # true for tqdm, false for print
io:
  checkpoint_dir: ./data/checkpoints
  generator_samples_dir: ./data/generator_samples
  val_samples_dir: ./data/val_samples
  log_dir: ./data/logs
model:
  in_channels: 4
training:
  max_steps: 2
  pretrain_mel_steps: 5
  train_batch_size: 1
  val_batch_size: 1
  train_num_workers: 4
  val_num_workers: 2
  pin_memory: true
  lr: 2e-4
  mel_loss_coeff: 45.0
  mrd_loss_coeff: 1.0
  bandwidth: 6.6
  spatial_loss_coeff: 0.01
  spatial_loss_every: 1
  val_every: 1
  save_every: 10
  sample_every: 1
  max_checkpoints: 10
  device: cpu